name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces that pull request's run. Runs on
# main are independent: each gets a group of its own, so none is cancelled
# and none waits behind another that is stuck in a queue.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  portable:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15 is Apple silicon, like macos-latest, but drawn from a
        # pool that has machines when the newest image's does not.
        os: [ubuntu-latest, macos-15]
    env:
      # The kernel programs are built in the `linux` job. Here the loader is
      # only type-checked against an empty stand-in.
      CEYNOX_WATCH_BPF_OBJECT: ${{ github.workspace }}/empty.o
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: touch empty.o
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: End-to-end tests (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --locked && dev/integration-macos.sh

  linux:
    name: build and end-to-end (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dev
          tags: ceynox-watch-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The static build, as released: it also has to run outside this
      # container, on the runner and inside other images.
      - name: Build
        run: dev/run.sh cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: End-to-end tests
        run: dev/run.sh env CEYNOX_WATCH_BIN=/target/x86_64-unknown-linux-musl/release/ceynox-watch dev/integration.sh
      - name: Take the binary out of the container
        run: |
          mkdir stage
          dev/run.sh cp /target/x86_64-unknown-linux-musl/release/ceynox-watch /src/stage/
          sudo chown -R "$(id -u)" stage

      # The action, on the runner itself: no container, sudo for the sensor.
      - name: "Action: a first run"
        id: first
        uses: ./
        with:
          binary: stage/ceynox-watch
          run: echo hello > "$RUNNER_TEMP/out.txt"
      - name: "Action: the same again, compared"
        uses: ./
        with:
          binary: stage/ceynox-watch
          baseline: ${{ steps.first.outputs.baseline }}
          fail-on: new,flagged
          run: echo hello > "$RUNNER_TEMP/out.txt"
      - name: "Action: a run that does more"
        id: more
        continue-on-error: true
        uses: ./
        with:
          binary: stage/ceynox-watch
          baseline: ${{ steps.first.outputs.baseline }}
          fail-on: new
          run: |
            echo hello > "$RUNNER_TEMP/out.txt"
            curl -s -m 20 -o /dev/null https://example.com
      - name: "Action: that one failed, and said why"
        env:
          OUTCOME: ${{ steps.more.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "expected the step to fail, it was: $OUTCOME"; exit 1; }
          grep -F 'example.com:443' "$CEYNOX_WATCH_REPORT"
          grep -F '### New since' "$CEYNOX_WATCH_REPORT"

      - name: Inspect a package in a throwaway container
        run: |
          stage/ceynox-watch --color never --inspect npm:left-pad@1.3.0 --report "$RUNNER_TEMP/inspect.md" 2> inspect.err || { cat inspect.err; exit 1; }
          cat inspect.err
          grep -F 'registry.npmjs.org:443' inspect.err
          grep -F 'Nothing touched' inspect.err
          grep -F 'npm:left-pad@1.3.0 in node:lts-slim' "$RUNNER_TEMP/inspect.md"
          [ -z "$(docker ps -aq --filter name=ceynox-watch-inspect)" ] || { echo "the container was left behind"; exit 1; }
      - name: Compare two packages, and inspect a lockfile
        run: |
          # esbuild runs an install script and left-pad does not, so the
          # first has programs the second lacks, and that fails the run.
          set +e
          stage/ceynox-watch --color never -q --inspect npm:esbuild@0.24.2 --against npm:left-pad@1.3.0 --fail-on new 2> against.err
          status=$?
          set -e
          cat against.err
          [ "$status" -eq 3 ] || { echo "expected exit status 3, got $status"; exit 1; }
          grep -F 'NEW SINCE npm:left-pad@1.3.0' against.err
          grep -F 'program      node [npm:esbuild]' against.err
          # The same package against itself has nothing new.
          stage/ceynox-watch --color never -q --inspect npm:left-pad@1.3.0 --against npm:left-pad@1.3.0 --fail-on new 2> same.err || { cat same.err; exit 1; }
          grep -F 'Nothing new since npm:left-pad@1.3.0.' same.err

          mkdir project && cd project
          echo '{"name":"demo","version":"1.0.0","private":true,"dependencies":{"esbuild":"0.24.2","left-pad":"1.3.0"}}' > package.json
          npm install --package-lock-only --no-audit --no-fund --loglevel=error
          ../stage/ceynox-watch --color never -q --inspect ./package-lock.json 2> lock.err || { cat lock.err; exit 1; }
          cat lock.err
          grep -F 'PACKAGES  1 ran code' lock.err
          grep -F 'npm:esbuild  3 programs' lock.err
          [ -z "$(docker ps -aq --filter name=ceynox-watch-inspect)" ] || { echo "a container was left behind"; exit 1; }

  # A short run of each fuzz target on every change: enough to catch a
  # parser that a change has made fragile. Long runs are for a workstation.
  fuzz:
    name: fuzz the parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: nightly-2026-09-12
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz
        run: |
          for target in dns btf capture; do
            cargo fuzz run "$target" -- -max_total_time=45 -max_len=4096
          done

  deny:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
