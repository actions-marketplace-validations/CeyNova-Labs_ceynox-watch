name: Scorecard

# OpenSSF Scorecard: an outside measure of how this repository is run
# (pinned dependencies, token permissions, branch protection and so on).
# Results are published at scorecard.dev and in the code scanning tab.
#
# This repository only runs third-party actions that are on its allow-list
# (Settings, Actions, General). ossf/scorecard-action is on it; a workflow
# that names an action which is not fails before it starts.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2"
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      # To upload the results to code scanning.
      security-events: write
      # To publish the results, which is what the badge reads.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
